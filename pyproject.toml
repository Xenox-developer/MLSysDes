[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I", "C", "D", "T"]
ignore = ["E203", "W503"]
exclude = ["build", "dist", ".venv", "venv", "data", "models", "__pycache__"]

[tool.ruff.per-file-ignores]
"tests/__init__.py" = ["F401"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
